[package]
name = "get-md"
version = "26.6.100"
edition = "2024"
rust-version = "1.88"
description = "Fetch a URL (with JS rendering via system Chrome) and convert selected elements to Markdown"
license = "MIT"
repository = "https://github.com/owayo/get-md"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive"] }
headless_chrome = "1.0.22"
htmd = "0.5.4"
indicatif = "0.18.6"
regex = "1.13.1"
url = "2.5.8"

[profile.release]
strip = true
lto = true
