[package]
name = "get-md"
version = "26.9.100"
edition = "2024"
rust-version = "1.98"
description = "Fetch a URL (with JS rendering via system Chrome) and convert selected elements to Markdown"
license = "MIT"
repository = "https://github.com/owayo/get-md"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
headless_chrome = "1.0.22"
htmd = "0.5.5"
icu_properties = "2.3.0"
indicatif = "0.18.6"
# htmd が組み立てる DOM の型 (NodeData) をそのまま使うので、htmd が依存する版に固定する (htmd を上げたらそろえる)
markup5ever_rcdom = "=0.38.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
url = "2.5.8"

[dev-dependencies]
yaml-rust2 = { version = "0.13.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
